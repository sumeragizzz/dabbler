<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Medical Receipt Confirm delete</title>
</head>
<body>
    <form method="post" th:action="@{/web/medicalReceipt/confirmDelete/submit}" th:object="${medicalReceiptConfirmDeleteForm}">
<!--    <form method="post" th:action="@{/web/medicalReceipt/confirmDelete/submit}">-->
        <button type="submit" name="execute">Execute</button>
        <button type="submit" name="cancel">Cancel</button>
        <table>
            <thead>
                <tr>
                    <th>id</th>
                    <th>examineeName</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="medicalReceipt : ${medicalReceipts}">
                    <td>
                        <span th:text="${medicalReceipt.id}"></span>
                        <input type="hidden" th:field="*{medicalReceipt.id}"></input>
<!--                        <input type="hidden" th:name="selectedIds" th:value="${medicalReceipt.id}"></input>-->
                    </td>
                    <td><span th:text="${medicalReceipt.examineeName}"></span></td>
                </tr>
            </tbody>
        </table>
    </form>
</body>
</html>
